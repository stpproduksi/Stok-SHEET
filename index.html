<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stok per Waktu</title>
<meta name="theme-color" content="#1D4E89">
<style>
  body{font-family:Arial,sans-serif;background:#F3F4F6;margin:0;padding:12px;font-size:15px;color:#14181F}
  h1{font-size:17px;margin:4px 0 10px}
  .card{background:#fff;border-radius:12px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0002}
  .bad{color:#B91C1C;font-weight:bold}
  input,select{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;font-size:15px;border:1px solid #ccc;border-radius:8px}
  label{font-size:12px;color:#5B6472;font-weight:bold;text-transform:uppercase}
  .btn{display:block;width:100%;padding:12px;margin-top:8px;border:0;border-radius:8px;background:#1D4E89;color:#fff;font-size:15px;font-weight:bold}
  .btn.wa{background:#25D366}
  .r{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
  .r b{font-family:monospace}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mono{font-family:monospace}
</style>
</head>
<body>
<h1>STOK PER WAKTU</h1>

<div class="card">
  <div class="row2">
    <div><label>Tanggal</label><input type="date" id="sTgl"></div>
    <div><label>Jam</label><input type="time" id="sJam"></div>
  </div>
  <label>Shift produksi</label>
  <select id="sShift"><option value="">Semua</option><option value="1">1</option><option value="2">2</option><option value="3">3</option></select>
  <button class="btn" onclick="sCari()">TAMPILKAN</button>
  <div id="sBox" style="margin-top:8px"></div>
</div>

<script>
var URL_EXEC='https://script.google.com/macros/s/AKfycbxp5L0rGdC0ki2M18YjNnylr0aAOXDLCzW5k84fJhT7aCkdlFrPeOY2tH0b75MMjDJh/exec';
var sRekap='';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmtN(n){ return Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:2}); }
function tglIndo(iso){ var p=String(iso||'').split('-'); return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:(iso||''); }
function hariIni(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function jamSekarang(){ var n=new Date(); return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'); }

function sInit(){
  document.getElementById('sTgl').value=hariIni();
  document.getElementById('sJam').value=jamSekarang();
}

function sBuatTeks(res, tgl, jam, shift){
  var t='📊 STOK PER WAKTU\nPosisi: '+tglIndo(tgl)+' '+jam+' | Shift: '+(shift||'Semua')+'\n';
  res.groups.forEach(function(g){
    t+='\n'+g.ukuran+'   '+fmtN(g.total)+' kg\n';
    g.rows.forEach(function(it){
      t+=it.carsheet+' | '+fmtN(it.berat)+' kg | TF '+it.untukTf+'\n'+
        it.tanggalTxt+' '+it.jam+' | Shift '+it.shift+' | KR '+it.nama+'\n';
    });
  });
  t+='\nTOTAL  '+fmtN(res.grand)+' kg ('+res.jumlah+' carsheet)';
  return t;
}

function sCari(){
  var tgl=document.getElementById('sTgl').value, jam=document.getElementById('sJam').value;
  var shift=document.getElementById('sShift').value;
  var box=document.getElementById('sBox');
  if(!tgl){ box.innerHTML='<div class="bad">Tanggal belum dipilih</div>'; return; }
  if(!jam){ box.innerHTML='<div class="bad">Jam belum dipilih</div>'; return; }
  box.innerHTML='Memuat...';
  fetch(URL_EXEC+'?action=stokAsOf&tgl='+encodeURIComponent(tgl)+'&jam='+encodeURIComponent(jam)+'&shift='+encodeURIComponent(shift))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res.ok){ box.innerHTML='<div class="bad">'+esc(res.error)+'</div>'; return; }
      if(!res.groups.length){ box.innerHTML='Tidak ada stok pada waktu tersebut.'; return; }
      sRekap=sBuatTeks(res, tgl, jam, shift);
      var html=res.groups.map(function(g){
        return '<div class="card mono">'+
          '<div style="font-size:15px;font-weight:bold">'+esc(g.ukuran)+'&nbsp;&nbsp;&nbsp;'+fmtN(g.total)+' kg</div>'+
          g.rows.map(function(it){
            return '<div style="margin-top:6px">'+esc(it.carsheet)+' | '+fmtN(it.berat)+' kg | TF '+esc(it.untukTf)+
              '<br><small>'+esc(it.tanggalTxt)+' '+esc(it.jam)+' | Shift '+esc(it.shift)+' | KR '+esc(it.nama)+'</small></div>';
          }).join('')+'</div>';
      }).join('');
      html+='<div class="card mono" style="font-size:15px;font-weight:bold">TOTAL&nbsp;&nbsp;&nbsp;'+fmtN(res.grand)+' kg<br>'+
        '<small style="font-weight:normal">'+res.jumlah+' carsheet</small></div>';
      html+='<button class="btn wa" onclick="sShare()">Share WA</button>';
      box.innerHTML=html;
    })
    .catch(function(e){ box.innerHTML='<div class="bad">Gagal: '+esc(e.message)+'</div>'; });
}

function sShare(){
  if(!sRekap){ alert('Tampilkan data dulu'); return; }
  window.open('https://wa.me/?text='+encodeURIComponent(sRekap),'_blank');
}

sInit();
</script>
</body>
</html>
